<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c2f3a"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c25a32"/>
    </marker>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#d8cbb5" opacity="0.55"/>
    </pattern>
    <style>
      .paper { fill: #f6f0e4; }
      .room { stroke: #2b2723; stroke-width: 12; stroke-linejoin: round; }
      .furn { fill: none; stroke: #2b2723; stroke-width: 2.2; stroke-linejoin: round; }
      .furn-fill { stroke: #2b2723; stroke-width: 2.2; stroke-linejoin: round; }
      .label { font-family: 'DejaVu Sans Mono', monospace; font-size: 12px; fill: #2b2723; letter-spacing: 1px; }
      .label-sm { font-family: 'DejaVu Sans Mono', monospace; font-size: 10px; fill: #5f5243; letter-spacing: 0.5px; }
      .title { font-family: 'DejaVu Serif', Georgia, serif; font-weight: bold; fill: #2b2723; }
      .mono { font-family: 'DejaVu Sans Mono', monospace; fill: #2b2723; }
      .fold { fill: none; stroke: #c25a32; stroke-width: 4; stroke-dasharray: 10 7; stroke-linecap: round; }
      .path { fill: none; stroke: #7c2f3a; stroke-width: 3.2; stroke-dasharray: 2 8; stroke-linecap: round; opacity: 0.9; }
      .door { fill: none; stroke: #2b2723; stroke-width: 2; stroke-dasharray: 4 4; }
      .sound { fill: #2f6f6a; }
      .sound-text { fill: #f6f0e4; font-family: 'DejaVu Sans Mono', monospace; font-size: 11px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
      .note { font-family: 'DejaVu Sans Mono', monospace; font-size: 10px; fill: #6b5d4d; }
      .faint { stroke: #d8cbb5; stroke-width: 1; }
    </style>
  </defs>

  <!-- fundo -->
  <rect width="1600" height="1100" fill="#f6f0e4"/>
  <rect width="1600" height="1100" fill="url(#dots)"/>

  <!-- ateliê, fora do modelo -->
  <rect x="60" y="960" width="1080" height="80" fill="#dce7e8"/>
  <line x1="60" y1="960" x2="1140" y2="960" stroke="#2b2723" stroke-width="8"/>
  <g stroke="#8fb3b8" stroke-width="1.5" opacity="0.65">
    <line x1="80" y1="985" x2="100" y2="1025"/>
    <line x1="140" y1="975" x2="160" y2="1015"/>
    <line x1="230" y1="990" x2="250" y2="1030"/>
    <line x1="300" y1="975" x2="320" y2="1015"/>
    <line x1="380" y1="990" x2="400" y2="1030"/>
    <line x1="460" y1="975" x2="480" y2="1015"/>
    <line x1="540" y1="990" x2="560" y2="1030"/>
    <line x1="620" y1="975" x2="640" y2="1015"/>
    <line x1="700" y1="990" x2="720" y2="1030"/>
    <line x1="780" y1="975" x2="800" y2="1015"/>
    <line x1="860" y1="990" x2="880" y2="1030"/>
    <line x1="1020" y1="975" x2="1040" y2="1015"/>
    <line x1="1080" y1="990" x2="1100" y2="1030"/>
  </g>
  <text x="480" y="990" class="label">ATELIÊ — FORA DO MODELO</text>
  <text x="480" y="1012" class="label-sm">mesa do arquiteto · chuva no telhado · escala 1:20</text>

  <!-- mesa e lâmpada no ateliê -->
  <rect x="900" y="982" width="190" height="34" fill="#c9a978" stroke="#2b2723" stroke-width="2.5"/>
  <line x1="930" y1="1016" x2="930" y2="1036" stroke="#2b2723" stroke-width="3"/>
  <line x1="1060" y1="1016" x2="1060" y2="1036" stroke="#2b2723" stroke-width="3"/>
  <circle cx="1090" cy="975" r="12" fill="#f2d38a" stroke="#2b2723" stroke-width="2"/>
  <line x1="1090" y1="963" x2="1090" y2="948" stroke="#2b2723" stroke-width="2"/>

  <!-- pisos -->
  <rect x="80" y="800" width="220" height="160" fill="#e6dccb"/>
  <rect x="80" y="420" width="480" height="380" fill="#f0e4d0"/>
  <rect x="560" y="420" width="120" height="460" fill="#efe7d8"/>
  <rect x="300" y="880" width="380" height="80" fill="#efe7d8"/>
  <rect x="680" y="420" width="300" height="280" fill="#e9dfcf"/>
  <rect x="680" y="760" width="180" height="140" fill="#e2d7c6"/>

  <!-- paredes -->
  <rect x="80" y="800" width="220" height="160" fill="none" class="room"/>
  <rect x="80" y="420" width="480" height="380" fill="none" class="room"/>
  <rect x="560" y="420" width="120" height="460" fill="none" class="room"/>
  <rect x="300" y="880" width="380" height="80" fill="none" class="room"/>
  <rect x="680" y="420" width="300" height="280" fill="none" class="room"/>
  <rect x="680" y="760" width="180" height="140" fill="none" class="room"/>

  <!-- aberturas -->
  <rect x="140" y="954" width="100" height="14" class="paper"/>
  <rect x="180" y="794" width="80" height="14" class="paper"/>
  <rect x="554" y="520" width="14" height="80" class="paper"/>
  <rect x="674" y="480" width="14" height="80" class="paper"/>
  <rect x="674" y="620" width="14" height="60" class="paper"/>
  <rect x="674" y="800" width="14" height="80" class="paper"/>
  <rect x="294" y="880" width="14" height="80" class="paper"/>
  <rect x="560" y="874" width="120" height="14" class="paper"/>

  <!-- portas -->
  <line x1="140" y1="960" x2="140" y2="900" stroke="#2b2723" stroke-width="3"/>
  <path d="M 140 900 A 60 60 0 0 1 200 960" class="door"/>

  <line x1="180" y1="800" x2="180" y2="740" stroke="#2b2723" stroke-width="3"/>
  <path d="M 180 740 A 60 60 0 0 1 240 800" class="door"/>

  <line x1="560" y1="520" x2="620" y2="520" stroke="#2b2723" stroke-width="3"/>
  <path d="M 620 520 A 60 60 0 0 1 560 580" class="door"/>

  <line x1="680" y1="480" x2="740" y2="480" stroke="#2b2723" stroke-width="3"/>
  <path d="M 740 480 A 60 60 0 0 1 680 540" class="door"/>

  <line x1="680" y1="620" x2="740" y2="620" stroke="#2b2723" stroke-width="3"/>
  <path d="M 740 620 A 60 60 0 0 1 680 680" class="door"/>

  <line x1="680" y1="800" x2="740" y2="800" stroke="#2b2723" stroke-width="3"/>
  <path d="M 740 800 A 60 60 0 0 1 680 860" class="door"/>

  <!-- janela do quarto -->
  <rect x="820" y="414" width="100" height="12" class="paper"/>
  <line x1="820" y1="420" x2="920" y2="420" stroke="#2b2723" stroke-width="3"/>
  <line x1="820" y1="427" x2="920" y2="427" stroke="#2b2723" stroke-width="2"/>
  <text x="930" y="424" class="label-sm">janela / ateliê</text>

  <!-- móveis: quarto de brincar -->
  <rect x="180" y="560" width="280" height="180" rx="8" fill="#e3d2ba" stroke="#b08d57" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="280" y="620" width="100" height="70" rx="4" fill="#c9a978" class="furn-fill"/>
  <line x1="300" y1="640" x2="360" y2="640" stroke="#2b2723" stroke-width="1.5"/>
  <rect x="200" y="590" width="28" height="28" fill="#d9b98a" class="furn-fill"/>
  <rect x="240" y="590" width="28" height="28" fill="#d9b98a" class="furn-fill"/>
  <rect x="220" y="630" width="28" height="28" fill="#d9b98a" class="furn-fill"/>
  <rect x="220" y="440" width="120" height="22" fill="#c9a978" class="furn-fill"/>
  <circle cx="280" cy="451" r="6" fill="#b08d57" stroke="#2b2723" stroke-width="1.5"/>
  <circle cx="420" cy="760" r="10" fill="#b08d57" stroke="#2b2723" stroke-width="2"/>
  <path d="M 300 780 Q 360 790 410 768" fill="none" stroke="#b08d57" stroke-width="2" stroke-dasharray="3 5"/>

  <!-- móveis: quarto de dormir -->
  <rect x="800" y="450" width="150" height="110" rx="4" fill="#e8dcc8" class="furn-fill"/>
  <rect x="810" y="460" width="40" height="35" rx="4" fill="#f6f0e4" class="furn"/>
  <line x1="860" y1="450" x2="860" y2="560" stroke="#2b2723" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="860" y="660" width="60" height="30" fill="#c9a978" class="furn-fill"/>
  <line x1="890" y1="660" x2="890" y2="690" stroke="#2b2723" stroke-width="1.5"/>
  <rect x="760" y="660" width="40" height="30" fill="#c9a978" class="furn-fill"/>
  <circle cx="780" cy="666" r="6" fill="#f2d38a" stroke="#2b2723" stroke-width="1.5"/>
  <rect x="958" y="480" width="12" height="70" fill="#cfdfe3" class="furn"/>
  <line x1="961" y1="490" x2="967" y2="490" stroke="#8fb3b8" stroke-width="1.5"/>
  <line x1="961" y1="510" x2="967" y2="510" stroke="#8fb3b8" stroke-width="1.5"/>
  <line x1="961" y1="530" x2="967" y2="530" stroke="#8fb3b8" stroke-width="1.5"/>

  <!-- boneco na cama -->
  <circle cx="900" cy="500" r="7" fill="#d9b98a" stroke="#2b2723" stroke-width="1.5"/>
  <rect x="894" y="507" width="12" height="20" rx="2" fill="#7c2f3a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="875" y="545" class="label-sm">boneco</text>

  <!-- sala das figuras -->
  <rect x="740" y="820" width="40" height="35" fill="#c9a978" class="furn-fill"/>
  <line x1="740" y1="820" x2="740" y2="800" stroke="#2b2723" stroke-width="3"/>
  <circle cx="810" cy="830" r="6" fill="#b08d57"/>
  <rect x="805" y="836" width="10" height="18" fill="#b08d57"/>
  <circle cx="840" cy="835" r="6" fill="#b08d57"/>
  <rect x="835" y="841" width="10" height="18" fill="#b08d57"/>
  <circle cx="870" cy="825" r="6" fill="#b08d57"/>
  <rect x="865" y="831" width="10" height="18" fill="#b08d57"/>
  <path d="M 700 885 L 840 885" stroke="#2b2723" stroke-width="4"/>

  <!-- entrada -->
  <rect x="120" y="820" width="120" height="45" fill="#e3d2ba" stroke="#b08d57" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="100" y="880" width="80" height="25" fill="#c9a978" class="furn-fill"/>

  <!-- linhas de dobra -->
  <line x1="96" y1="470" x2="96" y2="750" class="fold"/>
  <circle cx="96" cy="470" r="5" fill="#c25a32"/>
  <circle cx="96" cy="750" r="5" fill="#c25a32"/>
  <text x="110" y="610" class="mono" font-size="12" fill="#c25a32">F1</text>

  <line x1="544" y1="440" x2="544" y2="500" class="fold"/>
  <circle cx="544" cy="440" r="5" fill="#c25a32"/>
  <circle cx="544" cy="500" r="5" fill="#c25a32"/>
  <text x="505" y="438" class="mono" font-size="12" fill="#c25a32">F2</text>

  <line x1="578" y1="520" x2="578" y2="600" class="fold"/>
  <circle cx="578" cy="520" r="5" fill="#c25a32"/>
  <circle cx="578" cy="600" r="5" fill="#c25a32"/>
  <text x="590" y="612" class="mono" font-size="12" fill="#c25a32">F3</text>

  <line x1="578" y1="620" x2="578" y2="860" class="fold"/>
  <circle cx="578" cy="620" r="5" fill="#c25a32"/>
  <circle cx="578" cy="860" r="5" fill="#c25a32"/>
  <text x="590" y="790" class="mono" font-size="12" fill="#c25a32">F4</text>

  <!-- caminho sugerido, em quatro trechos -->
  <path d="M 200 930 L 220 800 L 220 740 L 140 680 L 140 600 L 440 600 L 560 560" class="path" marker-end="url(#arrow)"/>
  <path d="M 560 560 L 620 560 L 680 520 L 760 580 L 850 580 L 950 550 L 850 620 L 680 650" class="path" marker-end="url(#arrow)"/>
  <path d="M 620 650 L 620 800 L 680 840 L 780 840 L 680 840 L 620 880" class="path" marker-end="url(#arrow)"/>
  <path d="M 620 880 L 500 920 L 300 920 L 200 950 L 190 960 L 190 1000" class="path" marker-end="url(#arrow)"/>

  <!-- runner do corredor -->
  <rect x="320" y="900" width="340" height="40" fill="none" stroke="#b08d57" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
  <text x="330" y="895" class="label-sm">corredor</text>

  <!-- laço do corredor -->
  <circle cx="450" cy="920" r="16" fill="none" stroke="#c25a32" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M 450 904 A 16 16 0 0 1 466 920" fill="none" stroke="#c25a32" stroke-width="2.5" marker-end="url(#arrowLoop)"/>
  <text x="450" y="950" class="mono" font-size="10" fill="#c25a32" text-anchor="middle">LAÇO</text>

  <!-- pontos de som -->
  <g>
    <circle cx="420" cy="780" r="13" class="sound"/><text x="420" y="781" class="sound-text">1</text>
    <circle cx="120" cy="700" r="13" class="sound"/><text x="120" y="701" class="sound-text">2</text>
    <circle cx="340" cy="590" r="13" class="sound"/><text x="340" y="591" class="sound-text">3</text>
    <circle cx="620" cy="700" r="13" class="sound"/><text x="620" y="701" class="sound-text">4</text>
    <circle cx="950" cy="600" r="13" class="sound"/><text x="950" y="601" class="sound-text">5</text>
    <circle cx="940" cy="680" r="13" class="sound"/><text x="940" y="681" class="sound-text">6</text>
    <circle cx="930" cy="510" r="13" class="sound"/><text x="930" y="511" class="sound-text">7</text>
    <circle cx="300" cy="995" r="13" class="sound"/><text x="300" y="996" class="sound-text">8</text>
  </g>

  <!-- etiquetas -->
  <text x="80" y="405" class="label">1 · QUARTO DE BRINCAR</text>
  <text x="560" y="405" class="label">3 · CORREDOR</text>
  <text x="680" y="405" class="label">2 · QUARTO DE DORMIR</text>
  <text x="700" y="785" class="label-sm">3B · SALA DAS FIGURAS</text>
  <text x="100" y="940" class="label">ENTRADA</text>
  <text x="250" y="940" class="label-sm">porta da rua</text>
  <text x="270" y="780" class="label-sm">porta do quarto</text>
  <text x="590" y="505" class="label-sm">porta</text>
  <text x="700" y="470" class="label-sm">porta</text>
  <text x="700" y="610" class="label-sm">porta dos fundos</text>
  

  <!-- nota de percurso -->
  <text x="80" y="355" class="mono" font-size="11">PERCURSO: entrada → brincar → dormir → corredor → sala das figuras → porta.</text>
  <text x="80" y="375" class="note" font-style="italic">A casa aprende com o gesto. A porta nunca fecha.</text>

  <!-- bloco de título -->
  <text x="80" y="175" class="title" font-size="20">PLANTA BAIXA — CASA-MODELO 1:20</text>
  <text x="80" y="200" class="mono" font-size="11">O slice em uma página. Os números são sons; as linhas laranja são dobras.</text>
  <text x="80" y="220" class="note">A porta da frente (embaixo) está aberta desde 0:00. Sair é uma escolha.</text>

  <!-- chave de sons -->
  <rect x="620" y="150" width="500" height="180" fill="#fbf7ee" stroke="#d8cbb5" stroke-width="1.5"/>
  <text x="640" y="178" class="mono" font-size="12" letter-spacing="1.5">PONTOS DE SOM</text>
  <g>
    <circle cx="650" cy="205" r="10" class="sound"/><text x="650" y="206" class="sound-text">1</text><text x="670" y="209" class="note" font-size="11">bola de madeira</text>
    <circle cx="650" cy="235" r="10" class="sound"/><text x="650" y="236" class="sound-text">2</text><text x="670" y="239" class="note" font-size="11">clique da dobradiça</text>
    <circle cx="650" cy="265" r="10" class="sound"/><text x="650" y="266" class="sound-text">3</text><text x="670" y="269" class="note" font-size="11">caixa de música</text>
    <circle cx="650" cy="295" r="10" class="sound"/><text x="650" y="296" class="sound-text">4</text><text x="670" y="299" class="note" font-size="11">três batidas</text>
    <circle cx="890" cy="205" r="10" class="sound"/><text x="890" y="206" class="sound-text">5</text><text x="910" y="209" class="note" font-size="11">passo atrasado</text>
    <circle cx="890" cy="235" r="10" class="sound"/><text x="890" y="236" class="sound-text">6</text><text x="910" y="239" class="note" font-size="11">respiração</text>
    <circle cx="890" cy="265" r="10" class="sound"/><text x="890" y="266" class="sound-text">7</text><text x="910" y="269" class="note" font-size="11">tecido do boneco</text>
    <circle cx="890" cy="295" r="10" class="sound"/><text x="890" y="296" class="sound-text">8</text><text x="910" y="299" class="note" font-size="11">chuva + cantarolo</text>
  </g>
  <text x="640" y="320" class="note" font-style="italic">A casa não fala: ela responde.</text>

  <!-- coluna lateral -->
  <line x1="1180" y1="150" x2="1180" y2="1040" class="faint"/>
  <text x="1200" y="190" class="title" font-size="40">FAZ DE</text>
  <text x="1200" y="232" class="title" font-size="40">CONTA</text>
  <text x="1200" y="258" class="mono" font-size="13" letter-spacing="2">SLICE · PLANTA BAIXA</text>
  <line x1="1200" y1="275" x2="1540" y2="275" stroke="#2b2723" stroke-width="1.5"/>

  <text x="1200" y="310" class="title" font-size="24">15–20 min</text>
  <text x="1200" y="330" class="mono" font-size="10">3 CÔMODOS · SEM HUD · SEM FALHA</text>

  <text x="1200" y="370" class="mono" font-size="11" letter-spacing="1.5">AS TRÊS PROVAS</text>
  <text x="1200" y="396" class="note" font-size="12">1  A dobra é divertida.</text>
  <text x="1200" y="418" class="note" font-size="12">2  A casa aprende.</text>
  <text x="1200" y="440" class="note" font-size="12">3  O gesto volta errado.</text>

  <line x1="1200" y1="465" x2="1540" y2="465" class="faint"/>
  <text x="1200" y="495" class="mono" font-size="11" letter-spacing="1.5">LEGENDA</text>

  <line x1="1200" y1="520" x2="1240" y2="520" class="fold"/>
  <text x="1252" y="524" class="note" font-size="11">linha de dobra 90°</text>

  <circle cx="1220" cy="548" r="8" class="sound"/>
  <text x="1252" y="552" class="note" font-size="11">ponto de som</text>

  <line x1="1200" y1="576" x2="1240" y2="576" class="path" marker-end="url(#arrow)"/>
  <text x="1252" y="580" class="note" font-size="11">caminho sugerido</text>

  <circle cx="1220" cy="604" r="10" fill="none" stroke="#c25a32" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="1252" y="608" class="note" font-size="11">laço do corredor</text>

  <path d="M 1200 632 A 40 40 0 0 1 1240 672" class="door"/>
  <text x="1252" y="652" class="note" font-size="11">porta (sempre aberta)</text>

  <line x1="1200" y1="695" x2="1540" y2="695" class="faint"/>
  <text x="1200" y="725" class="mono" font-size="11" letter-spacing="1.5">O QUE ELA APRENDE</text>
  <text x="1200" y="752" class="note" font-size="11">dobra   →  lado esquerdo</text>
  <text x="1200" y="774" class="note" font-size="11">batida  →  3 toques</text>
  <text x="1200" y="796" class="note" font-size="11">boneco  →  cores e postura</text>
  <text x="1200" y="818" class="note" font-size="11">música  →  caixa de música</text>
  <text x="1200" y="840" class="note" font-size="11">objeto  →  sala-santuário</text>

  <line x1="1200" y1="870" x2="1540" y2="870" class="faint"/>
  <text x="1200" y="900" class="mono" font-size="11" letter-spacing="1.5">RITMO</text>
  <text x="1200" y="926" class="note" font-size="11">0–6    brincar</text>
  <text x="1200" y="948" class="note" font-size="11">6–12   aprender</text>
  <text x="1200" y="970" class="note" font-size="11">12–18  guardar</text>
  <text x="1200" y="992" class="note" font-size="11">18–20  escolher</text>

  <text x="1200" y="1035" class="note" font-size="10" font-style="italic">A porta da frente está aberta desde 0:00.</text>
  <text x="1200" y="1055" class="note" font-size="10" font-style="italic">Sair é uma escolha.</text>
  <text x="210" y="1015" class="label-sm">SAÍDA</text>
</svg>
